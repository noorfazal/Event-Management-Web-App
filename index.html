<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Management Web App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎪 Event Management Web App</h1>
            <p>Manage Your Events Smartly</p>
        </header>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 Search by event name or date (YYYY-MM-DD)">
        </div>
        <div id="eventsContainer" class="events-grid"></div>
        <div class="form-card">
            <h2>✨ Add New Event</h2>
            <div id="warningMsg" class="warning">⚠️ All fields are required!</div>
            <div class="form-group">
                <label>Event Name</label>
                <input type="text" id="eventName" placeholder="e.g., Tech Conference 2026">
            </div>
            <div class="form-group">
                <label>Event Date</label>
                <input type="date" id="eventDate">
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea id="eventDesc" placeholder="Describe the event..."></textarea>
            </div>
            <button class="add-btn" id="addBtn">
            ➕ Add Event</button>
        </div>
        <footer>
            <p>Developed by <strong>Your NOOR</strong> — © 2026 Event Management Web App</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
